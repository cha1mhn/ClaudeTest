<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Portfolio</title>
<meta name="description" content="Personal portfolio." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBFAF7; --surface:#FFFFFF; --ink:#17171B; --muted:#6B6B73;
  --line:#E6E4DE; --accent:#3A5A40; --accent-soft:#EBF0EC; --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.05);
  --r:14px; --max:980px;
}
:root[data-theme="dark"]{
  --bg:#111113; --surface:#17171A; --ink:#F2F1ED; --muted:#9A9AA3;
  --line:#2A2A2F; --accent:#8FBF9F; --accent-soft:#1D2620; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 28px rgba(0,0,0,.35);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111113; --surface:#17171A; --ink:#F2F1ED; --muted:#9A9AA3;
    --line:#2A2A2F; --accent:#8FBF9F; --accent-soft:#1D2620; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 28px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto} *{animation-duration:.01ms!important;transition-duration:.01ms!important}}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font:400 16.5px/1.65 Inter,system-ui,-apple-system,Segoe UI,sans-serif;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
.wrap{max-width:var(--max);margin:0 auto;padding:0 16px}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:600;letter-spacing:-.02em;line-height:1.15;margin:0}
a{color:inherit}
::selection{background:var(--accent-soft);color:var(--ink)}

/* progress */
#prog{position:fixed;top:0;left:0;height:2px;width:0;background:var(--accent);z-index:60;transition:width .08s linear}

/* nav */
header{position:sticky;top:0;z-index:50;backdrop-filter:blur(12px);background:color-mix(in srgb,var(--bg) 82%,transparent);border-bottom:1px solid transparent;transition:border-color .3s}
header.stuck{border-color:var(--line)}
.nav{display:flex;align-items:center;gap:8px;height:60px}
.brand{font-family:Fraunces,serif;font-weight:600;font-size:18px;margin-right:auto;text-decoration:none;display:flex;align-items:center;gap:9px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--accent);flex:none;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.72);opacity:.55}}
.nav-links{display:flex;gap:2px}
.nav-links a{position:relative;text-decoration:none;font-size:14px;color:var(--muted);padding:7px 11px;border-radius:99px;transition:color .2s,background .2s}
.nav-links a:hover{color:var(--ink);background:var(--accent-soft)}
.nav-links a.active{color:var(--ink)}
.nav-links a.active::after{content:"";position:absolute;left:11px;right:11px;bottom:2px;height:1.5px;background:var(--accent);border-radius:2px}
.iconbtn{border:1px solid var(--line);background:var(--surface);color:var(--muted);width:34px;height:34px;border-radius:9px;cursor:pointer;display:grid;place-items:center;font-size:14px;transition:.2s}
.iconbtn:hover{color:var(--ink);border-color:var(--accent);transform:translateY(-1px)}
.kbd{font-family:'JetBrains Mono',monospace;font-size:11px;border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:5px 9px;color:var(--muted);cursor:pointer;transition:.2s}
.kbd:hover{color:var(--ink);border-color:var(--accent)}
@media(max-width:720px){.nav-links{display:none}}

/* hero */
.hero{padding:88px 0 64px;position:relative}
.eyebrow{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:18px}
.hero h1{font-size:clamp(38px,7.2vw,68px);margin-bottom:18px}
.hero h1 .grad{background:linear-gradient(100deg,var(--ink),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
.role{font-size:clamp(18px,3vw,23px);color:var(--muted);min-height:1.6em;margin-bottom:22px;font-family:Fraunces,serif}
.role .cursor{display:inline-block;width:2px;height:1em;background:var(--accent);vertical-align:-2px;margin-left:2px;animation:blink 1s step-end infinite}
@keyframes blink{50%{opacity:0}}
.bio{font-size:17.5px;color:var(--muted);max-width:60ch;margin-bottom:30px}
.cta{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-size:14.5px;font-weight:500;padding:11px 18px;border-radius:10px;border:1px solid var(--line);background:var(--surface);transition:.2s;cursor:pointer;color:inherit;font-family:inherit}
.btn:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--accent)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.primary:hover{background:var(--accent);border-color:var(--accent)}

/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-top:52px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;transition:.25s}
.stat:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--accent)}
.stat b{display:block;font-family:Fraunces,serif;font-size:31px;line-height:1;margin-bottom:6px}
.stat span{font-size:12.5px;color:var(--muted)}

/* sections */
section{padding:66px 0;scroll-margin-top:72px}
.sec-head{display:flex;align-items:baseline;gap:14px;margin-bottom:30px}
.sec-head h2{font-size:clamp(25px,4vw,33px)}
.sec-head .num{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--accent)}
.sec-head .rule{flex:1;height:1px;background:var(--line)}

/* timeline */
.tl{position:relative;padding-left:26px}
.tl::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:1.5px;background:var(--line)}
.job{position:relative;margin-bottom:12px}
.job::before{content:"";position:absolute;left:-25.5px;top:20px;width:11px;height:11px;border-radius:50%;background:var(--bg);border:2px solid var(--line);transition:.25s}
.job.open::before,.job:hover::before{border-color:var(--accent);background:var(--accent)}
.job-hd{width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;cursor:pointer;font:inherit;color:inherit;transition:.25s;display:flex;gap:14px;align-items:flex-start}
.job-hd:hover{border-color:var(--accent);transform:translateX(3px)}
.job.open .job-hd{border-color:var(--accent);background:var(--accent-soft)}
.job-hd .t{flex:1;min-width:0}
.job-hd h3{font-size:17.5px;margin-bottom:3px}
.job-hd .co{font-size:14px;color:var(--accent);font-weight:500}
.job-hd .when{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--muted);white-space:nowrap;padding-top:3px}
.chev{color:var(--muted);transition:transform .3s;flex:none;padding-top:2px}
.job.open .chev{transform:rotate(180deg)}
.job-body{max-height:0;overflow:hidden;transition:max-height .4s cubic-bezier(.4,0,.2,1)}
.job-body-in{padding:14px 18px 6px 18px;color:var(--muted);font-size:15px}
.job-body-in ul{margin:0 0 12px;padding-left:18px}
.job-body-in li{margin-bottom:6px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-family:'JetBrains Mono',monospace;font-size:11px;padding:4px 9px;border-radius:99px;background:var(--accent-soft);color:var(--accent);border:1px solid transparent}

/* skills */
.filters{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:22px}
.chip{font-size:13px;padding:7px 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer;font-family:inherit;transition:.2s}
.chip:hover{color:var(--ink);border-color:var(--accent)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.skills{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.skill{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:13px 15px;transition:.3s}
.skill:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:var(--shadow)}
.skill.hide{display:none}
.skill .row{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;font-size:14.5px;font-weight:500}
.skill .row em{font-style:normal;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted)}
.bar{height:4px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:var(--accent);transition:width 1.1s cubic-bezier(.22,1,.36,1)}

/* projects */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;transition:.3s;position:relative;overflow:hidden;text-decoration:none;display:block}
.card::after{content:"";position:absolute;inset:0;background:radial-gradient(420px circle at var(--mx,50%) var(--my,50%),var(--accent-soft),transparent 55%);opacity:0;transition:opacity .35s;pointer-events:none}
.card:hover::after{opacity:1}
.card:hover{transform:translateY(-4px);box-shadow:var(--shadow);border-color:var(--accent)}
.card h3{font-size:18px;margin-bottom:7px;position:relative}
.card p{color:var(--muted);font-size:14.5px;margin:0 0 14px;position:relative}
.card .tags{position:relative}

/* education */
.edu{display:grid;gap:10px}
.edu-item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:17px 19px;display:flex;justify-content:space-between;gap:16px;align-items:center;transition:.25s}
.edu-item:hover{border-color:var(--accent);transform:translateX(3px)}
.edu-item h3{font-size:16.5px;margin-bottom:3px}
.edu-item .s{font-size:14px;color:var(--muted)}
.edu-item .when{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--muted);white-space:nowrap}

/* contact */
.contact{text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:52px 24px}
.contact h2{font-size:clamp(26px,4.5vw,38px);margin-bottom:12px}
.contact p{color:var(--muted);max-width:46ch;margin:0 auto 26px}
footer{padding:36px 0 44px;text-align:center;color:var(--muted);font-size:13px;border-top:1px solid var(--line);margin-top:56px}

/* reveal */
.rv{opacity:0;transform:translateY(18px);transition:opacity .6s ease,transform .6s cubic-bezier(.22,1,.36,1)}
.rv.in{opacity:1;transform:none}

/* command palette */
.pal-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);backdrop-filter:blur(3px);z-index:100;display:none;align-items:flex-start;justify-content:center;padding:14vh 16px 16px}
.pal-bg.on{display:flex}
.pal{background:var(--surface);border:1px solid var(--line);border-radius:15px;width:100%;max-width:520px;box-shadow:0 24px 64px rgba(0,0,0,.28);overflow:hidden;animation:pop .18s ease}
@keyframes pop{from{opacity:0;transform:translateY(-8px) scale(.98)}}
.pal input{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--ink);padding:16px 18px;font:400 15.5px Inter,sans-serif;outline:none}
.pal ul{list-style:none;margin:0;padding:6px;max-height:320px;overflow:auto}
.pal li{padding:10px 13px;border-radius:9px;cursor:pointer;display:flex;gap:11px;align-items:center;font-size:14.5px}
.pal li .h{color:var(--muted);font-size:12px;margin-left:auto;font-family:'JetBrains Mono',monospace}
.pal li.sel{background:var(--accent-soft)}
.pal .empty{padding:20px;text-align:center;color:var(--muted);font-size:14px}

/* toast */
#toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,80px);background:var(--ink);color:var(--bg);padding:11px 20px;border-radius:99px;font-size:14px;z-index:120;transition:transform .35s cubic-bezier(.22,1,.36,1)}
#toast.on{transform:translate(-50%,0)}
</style>
</head>
<body>
<div id="prog"></div>

<header id="hdr">
  <div class="wrap nav">
    <a class="brand" href="#top"><span class="dot"></span><span id="brandName">Your Name</span></a>
    <nav class="nav-links" id="navLinks"></nav>
    <button class="kbd" id="palBtn" title="Open command palette">⌘K</button>
    <button class="iconbtn" id="themeBtn" title="Toggle theme" aria-label="Toggle theme">◐</button>
  </div>
</header>

<main class="wrap" id="top">

  <section class="hero" id="home" style="scroll-margin-top:0">
    <div class="eyebrow rv" id="location">— Available for work</div>
    <h1 class="rv">Hi, I'm <span class="grad" id="heroName">Your Name</span></h1>
    <div class="role rv" id="role"><span class="cursor"></span></div>
    <p class="bio rv" id="bio"></p>
    <div class="cta rv" id="cta"></div>
    <div class="stats" id="stats"></div>
  </section>

  <section id="about">
    <div class="sec-head rv"><span class="num">01</span><h2>About</h2><span class="rule"></span></div>
    <p class="bio rv" id="about-text" style="font-size:17px;max-width:68ch"></p>
  </section>

  <section id="experience">
    <div class="sec-head rv"><span class="num">02</span><h2>Experience</h2><span class="rule"></span></div>
    <div class="tl" id="timeline"></div>
  </section>

  <section id="skills">
    <div class="sec-head rv"><span class="num">03</span><h2>Skills</h2><span class="rule"></span></div>
    <div class="filters rv" id="filters"></div>
    <div class="skills" id="skillGrid"></div>
  </section>

  <section id="projects">
    <div class="sec-head rv"><span class="num">04</span><h2>Projects</h2><span class="rule"></span></div>
    <div class="cards" id="projGrid"></div>
  </section>

  <section id="education">
    <div class="sec-head rv"><span class="num">05</span><h2>Education</h2><span class="rule"></span></div>
    <div class="edu" id="eduList"></div>
  </section>

  <section id="contact">
    <div class="contact rv">
      <h2>Let's build something.</h2>
      <p id="contactBlurb"></p>
      <div class="cta" style="justify-content:center" id="contactLinks"></div>
    </div>
  </section>
</main>

<footer class="wrap">
  <span id="footText"></span>
</footer>

<div class="pal-bg" id="palBg">
  <div class="pal" role="dialog" aria-label="Command palette">
    <input id="palInput" placeholder="Jump to a section, or type a command…" autocomplete="off" />
    <ul id="palList"></ul>
  </div>
</div>
<div id="toast"></div>

<script>
/* ============================================================
   EDIT THIS OBJECT — everything on the page renders from it.
   Replace the placeholder values with your LinkedIn details.
   ============================================================ */
const PROFILE = {
  name: "Your Name",
  location: "City, Country · Open to opportunities",
  roles: ["Software Engineer", "Product Builder", "Problem Solver"],
  bio: "One or two sentences from your LinkedIn headline and About section — what you do, who you do it for, and what you're good at.",
  about: "Your longer About section goes here. A few sentences on your background, the kind of work you enjoy, the impact you've had, and what you're looking for next.",
  contactBlurb: "Always happy to talk about interesting problems, new roles, or collaboration.",
  email: "you@example.com",
  links: [
    { label: "LinkedIn", href: "https://linkedin.com/in/your-handle" },
    { label: "GitHub",   href: "https://github.com/your-handle" },
    { label: "Resume",   href: "#" }
  ],
  stats: [
    { value: "5+",  label: "Years experience" },
    { value: "12",  label: "Projects shipped" },
    { value: "4",   label: "Companies" },
    { value: "∞",   label: "Cups of coffee" }
  ],
  experience: [
    {
      title: "Senior Something",
      company: "Company Name",
      when: "2023 — Present",
      points: [
        "A bullet from your LinkedIn describing what you owned.",
        "A bullet with a number in it — scale, growth, savings, users.",
        "A bullet about a thing you built or a team you led."
      ],
      tags: ["Skill", "Skill", "Tool"]
    },
    {
      title: "Previous Role",
      company: "Previous Company",
      when: "2021 — 2023",
      points: [
        "What you were responsible for.",
        "A measurable outcome."
      ],
      tags: ["Skill", "Tool"]
    },
    {
      title: "Earlier Role",
      company: "Earlier Company",
      when: "2019 — 2021",
      points: ["Where you started and what you learned."],
      tags: ["Skill"]
    }
  ],
  skills: [
    { name: "Skill One",   level: 92, cat: "Core" },
    { name: "Skill Two",   level: 86, cat: "Core" },
    { name: "Skill Three", level: 80, cat: "Tools" },
    { name: "Skill Four",  level: 75, cat: "Tools" },
    { name: "Skill Five",  level: 88, cat: "Soft" },
    { name: "Skill Six",   level: 70, cat: "Soft" }
  ],
  projects: [
    { name: "Project One", desc: "One line on what it is and why it mattered.", tags: ["Tag","Tag"], href: "#" },
    { name: "Project Two", desc: "One line on what it is and why it mattered.", tags: ["Tag"], href: "#" },
    { name: "Project Three", desc: "One line on what it is and why it mattered.", tags: ["Tag","Tag"], href: "#" }
  ],
  education: [
    { school: "University Name", detail: "Degree, Field of Study", when: "2015 — 2019" },
    { school: "Certification Body", detail: "Certification name", when: "2022" }
  ]
};

/* ---------- render ---------- */
const $ = (s,r=document)=>r.querySelector(s);
const el = (t,c,h)=>{const n=document.createElement(t);if(c)n.className=c;if(h!=null)n.innerHTML=h;return n;};
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

document.title = PROFILE.name + " — Portfolio";
$('#brandName').textContent = PROFILE.name;
$('#heroName').textContent = PROFILE.name;
$('#location').textContent = "— " + PROFILE.location;
$('#bio').textContent = PROFILE.bio;
$('#about-text').textContent = PROFILE.about;
$('#contactBlurb').textContent = PROFILE.contactBlurb;
$('#footText').textContent = "© " + new Date().getFullYear() + " " + PROFILE.name + " · built by hand";

// nav
const SECTIONS = [["about","About"],["experience","Experience"],["skills","Skills"],["projects","Projects"],["education","Education"],["contact","Contact"]];
$('#navLinks').innerHTML = SECTIONS.map(([id,l])=>`<a href="#${id}" data-s="${id}">${l}</a>`).join('');

// cta
const ctaHTML = `<button class="btn primary" id="copyEmail">✉ ${esc(PROFILE.email)}</button>` +
  PROFILE.links.map(l=>`<a class="btn" href="${esc(l.href)}" target="_blank" rel="noopener">${esc(l.label)} ↗</a>`).join('');
$('#cta').innerHTML = ctaHTML;
$('#contactLinks').innerHTML = ctaHTML.replace('id="copyEmail"','id="copyEmail2"');

// stats
$('#stats').innerHTML = PROFILE.stats.map((s,i)=>
  `<div class="stat rv" style="transition-delay:${i*70}ms"><b data-count="${esc(s.value)}">${esc(s.value)}</b><span>${esc(s.label)}</span></div>`).join('');

// timeline
$('#timeline').innerHTML = PROFILE.experience.map((j,i)=>`
  <article class="job rv" style="transition-delay:${i*80}ms">
    <button class="job-hd" aria-expanded="false">
      <span class="t"><h3>${esc(j.title)}</h3><span class="co">${esc(j.company)}</span></span>
      <span class="when">${esc(j.when)}</span><span class="chev">▾</span>
    </button>
    <div class="job-body"><div class="job-body-in">
      <ul>${j.points.map(p=>`<li>${esc(p)}</li>`).join('')}</ul>
      <div class="tags">${j.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>
    </div></div>
  </article>`).join('');

document.querySelectorAll('.job-hd').forEach(btn=>{
  btn.addEventListener('click',()=>{
    const job = btn.parentElement, body = job.querySelector('.job-body'), open = job.classList.contains('open');
    document.querySelectorAll('.job.open').forEach(o=>{o.classList.remove('open');o.querySelector('.job-body').style.maxHeight='0';o.querySelector('.job-hd').setAttribute('aria-expanded','false');});
    if(!open){job.classList.add('open');body.style.maxHeight=body.scrollHeight+'px';btn.setAttribute('aria-expanded','true');}
  });
});
document.querySelector('.job-hd')?.click(); // first one open by default

// skills
const cats = ["All", ...new Set(PROFILE.skills.map(s=>s.cat))];
$('#filters').innerHTML = cats.map((c,i)=>`<button class="chip${i===0?' on':''}" data-cat="${esc(c)}">${esc(c)}</button>`).join('');
$('#skillGrid').innerHTML = PROFILE.skills.map((s,i)=>`
  <div class="skill rv" data-cat="${esc(s.cat)}" style="transition-delay:${i*50}ms">
    <div class="row"><span>${esc(s.name)}</span><em>${s.level}</em></div>
    <div class="bar"><i data-w="${s.level}"></i></div>
  </div>`).join('');
$('#filters').addEventListener('click',e=>{
  const b=e.target.closest('.chip'); if(!b)return;
  document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c===b));
  const cat=b.dataset.cat;
  document.querySelectorAll('.skill').forEach(s=>s.classList.toggle('hide', cat!=='All' && s.dataset.cat!==cat));
});

// projects
$('#projGrid').innerHTML = PROFILE.projects.map((p,i)=>`
  <a class="card rv" href="${esc(p.href)}" ${p.href!=='#'?'target="_blank" rel="noopener"':''} style="transition-delay:${i*70}ms">
    <h3>${esc(p.name)}</h3><p>${esc(p.desc)}</p>
    <div class="tags">${p.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>
  </a>`).join('');
document.querySelectorAll('.card').forEach(c=>c.addEventListener('pointermove',e=>{
  const r=c.getBoundingClientRect();
  c.style.setProperty('--mx',(e.clientX-r.left)+'px');
  c.style.setProperty('--my',(e.clientY-r.top)+'px');
}));

// education
$('#eduList').innerHTML = PROFILE.education.map((e,i)=>`
  <div class="edu-item rv" style="transition-delay:${i*70}ms">
    <div><h3>${esc(e.school)}</h3><div class="s">${esc(e.detail)}</div></div>
    <div class="when">${esc(e.when)}</div>
  </div>`).join('');

/* ---------- interactions ---------- */
// typing roles
(function(){
  const box=$('#role'), cur=el('span','cursor');
  let ri=0,ci=0,del=false;
  const txt=el('span');box.textContent='';box.append(txt,cur);
  (function tick(){
    const w=PROFILE.roles[ri];
    txt.textContent = w.slice(0, del? --ci : ++ci);
    let d = del?45:75;
    if(!del && ci===w.length){del=true;d=1700;}
    else if(del && ci===0){del=false;ri=(ri+1)%PROFILE.roles.length;d=320;}
    setTimeout(tick,d);
  })();
})();

// reveal + bars + scrollspy
const io=new IntersectionObserver(es=>es.forEach(e=>{
  if(e.isIntersecting){e.target.classList.add('in');
    e.target.querySelectorAll?.('.bar i').forEach(b=>b.style.width=b.dataset.w+'%');
    io.unobserve(e.target);}
}),{threshold:.12,rootMargin:'0px 0px -40px'});
document.querySelectorAll('.rv').forEach(n=>io.observe(n));

const spy=new IntersectionObserver(es=>es.forEach(e=>{
  if(e.isIntersecting) document.querySelectorAll('.nav-links a').forEach(a=>a.classList.toggle('active',a.dataset.s===e.target.id));
}),{rootMargin:'-45% 0px -50% 0px'});
SECTIONS.forEach(([id])=>{const n=document.getElementById(id); if(n) spy.observe(n);});

// progress + sticky border
addEventListener('scroll',()=>{
  const h=document.documentElement;
  $('#prog').style.width=(h.scrollTop/(h.scrollHeight-h.clientHeight)*100)+'%';
  $('#hdr').classList.toggle('stuck',h.scrollTop>10);
},{passive:true});

// theme
const T=$('#themeBtn');
try{const s=localStorage.getItem('theme'); if(s)document.documentElement.dataset.theme=s;}catch(e){}
T.addEventListener('click',()=>{
  const dark = getComputedStyle(document.body).backgroundColor.match(/\d+/g).slice(0,3).reduce((a,b)=>a+ +b,0)/3 < 128;
  const next = dark?'light':'dark';
  document.documentElement.dataset.theme=next;
  try{localStorage.setItem('theme',next);}catch(e){}
  toast(next==='dark'?'Dark mode':'Light mode');
});

// toast + copy email
let tt;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),1900);}
function copyEmail(){
  navigator.clipboard?.writeText(PROFILE.email).then(()=>toast('Email copied ✓'),()=>toast(PROFILE.email));
}
document.addEventListener('click',e=>{ if(e.target.closest('#copyEmail,#copyEmail2')) copyEmail(); });

// command palette
const CMDS=[
  ...SECTIONS.map(([id,l])=>({t:'Go to '+l, h:'section', run:()=>document.getElementById(id).scrollIntoView()})),
  {t:'Copy email address', h:'action', run:copyEmail},
  {t:'Toggle dark / light', h:'action', run:()=>T.click()},
  {t:'Back to top', h:'action', run:()=>scrollTo({top:0,behavior:'smooth'})},
  ...PROFILE.links.map(l=>({t:'Open '+l.label, h:'link', run:()=>window.open(l.href,'_blank','noopener')}))
];
const bg=$('#palBg'), inp=$('#palInput'), list=$('#palList');
let sel=0, view=CMDS;
function draw(){
  view = CMDS.filter(c=>c.t.toLowerCase().includes(inp.value.toLowerCase()));
  sel = Math.min(sel, Math.max(0,view.length-1));
  list.innerHTML = view.length
    ? view.map((c,i)=>`<li class="${i===sel?'sel':''}" data-i="${i}">${esc(c.t)}<span class="h">${c.h}</span></li>`).join('')
    : '<div class="empty">No matches</div>';
}
function openPal(){bg.classList.add('on');inp.value='';sel=0;draw();inp.focus();}
function closePal(){bg.classList.remove('on');}
$('#palBtn').addEventListener('click',openPal);
bg.addEventListener('click',e=>{if(e.target===bg)closePal();});
inp.addEventListener('input',()=>{sel=0;draw();});
list.addEventListener('click',e=>{const li=e.target.closest('li');if(!li)return;closePal();view[+li.dataset.i].run();});
list.addEventListener('pointermove',e=>{const li=e.target.closest('li');if(!li)return;sel=+li.dataset.i;draw();});
addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();bg.classList.contains('on')?closePal():openPal();return;}
  if(e.key==='/'&&!/input|textarea/i.test(document.activeElement.tagName)){e.preventDefault();openPal();return;}
  if(!bg.classList.contains('on'))return;
  if(e.key==='Escape')closePal();
  else if(e.key==='ArrowDown'){e.preventDefault();sel=(sel+1)%view.length;draw();}
  else if(e.key==='ArrowUp'){e.preventDefault();sel=(sel-1+view.length)%view.length;draw();}
  else if(e.key==='Enter'&&view[sel]){closePal();view[sel].run();}
});
</script>
</body>
</html>
